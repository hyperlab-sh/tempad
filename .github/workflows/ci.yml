name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Lint and format (Biome)
        run: bun run lint

      - name: Format check (dprint)
        uses: dprint/check@v2.3

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
